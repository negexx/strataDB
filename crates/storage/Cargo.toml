[package]
name = "strata-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Optional + gated by `chaos-injection`: `tests/bin/chaos_checkpoint_helper.rs`
# is a `[[bin]]` target (not a test/example/bench), so it can't see
# `[dev-dependencies]` — it needs `tempfile` as a real (if optional) crate
# dependency. Gating it behind the feature that already restricts this bin's
# `required-features` keeps a plain, feature-less `cargo build -p
# strata-storage` free of it, matching this crate's existing chaos-injection
# isolation story. Unit tests get `tempfile` unconditionally via the
# `[dev-dependencies]` entry below regardless of this feature.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
chaos-injection = ["dep:tempfile"]

[[bin]]
name = "chaos_checkpoint_helper"
# Lives in tests/bin/, not directly under tests/, so Cargo's test-file
# autodiscovery doesn't also register this same source as a second,
# separate `integration-test` target (which would silently do nothing,
# since it has no #[test] fns, but prints a "found in multiple build
# targets" warning on every build).
path = "tests/bin/chaos_checkpoint_helper.rs"
required-features = ["chaos-injection"]
