[package]
name = "strata-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arrow.workspace = true
crc32c = "0.6"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[features]
chaos-injection = []
# Enables the thread-local directory-sync fault seam used only by dependent
# crate tests. It is not enabled by normal consumers.
test-fault-injection = []

[[bin]]
name = "chaos_checkpoint_helper"
# Lives in tests/bin/, not directly under tests/, so Cargo's test-file
# autodiscovery doesn't also register this same source as a second,
# separate `integration-test` target (which would silently do nothing,
# since it has no #[test] fns, but prints a "found in multiple build
# targets" warning on every build).
path = "tests/bin/chaos_checkpoint_helper.rs"
required-features = ["chaos-injection"]
