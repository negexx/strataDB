[package]
name = "strata-txn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `loom` is this crate's only consumer of a `#[cfg(loom)]` gate (see the
# `loom_tests` module at the end of src/dataset.rs) — without this, rustc's
# `unexpected_cfgs` lint (warn-by-default since 1.80) flags `loom` as an
# unrecognized cfg name, since nothing else declares it. This can't instead
# be expressed via `[lints] workspace = true` (as this crate did before)
# because Cargo forbids combining workspace-inherited lints with any
# additional local keys in the same [lints] table — so the workspace's
# clippy/rust lints are duplicated here rather than inherited, matching
# `crates/index/Cargo.toml`'s identical workaround for the same reason.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
arrow.workspace = true
thiserror.workspace = true
strata-storage = { path = "../storage" }
strata-query = { path = "../query" }
strata-index = { path = "../index" }
arc-swap = "1"
imbl = "7"

[dev-dependencies]
loom = "0.7"
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
chaos-injection = ["strata-storage/chaos-injection"]
test-fault-injection = ["strata-storage/test-fault-injection"]
# Off by default, matching `chaos-injection`'s own precedent for a
# risk-bearing, opt-in code path -- see `build_and_write_segment` in
# `src/dataset.rs` and `.opencode/rules/vector-index.md` for what this
# switches between. Unlike `chaos-injection` (always compiled, inert
# unless an env var is set), this is a genuine compile-time branch: the
# commit path calls `HnswIndex::insert_batch_parallel` only when this
# feature is enabled, and falls back to a plain sequential per-row loop
# otherwise. With it on, worker-thread scheduling makes graph shape (and
# so the exact bytes of a committed `.seg` file) non-deterministic across
# runs of an otherwise-identical commit -- harmless today since nothing
# depends on byte-identical replays, but don't enable this for a chaos-
# harness workload that ever grows one.
parallel-insert = []
