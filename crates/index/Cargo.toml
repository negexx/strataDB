[package]
name = "strata-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `loom` is consumed via a `#[cfg(loom)]`/`#[cfg(not(loom))]` shim in
# node.rs/node_table.rs/slot_array.rs/graph.rs — without this, rustc's
# `unexpected_cfgs` lint (warn-by-default since 1.80) flags `loom` as an
# unrecognized cfg name, since nothing else declares it. This can't
# instead be expressed via `[lints] workspace = true` (as every other
# crate in this workspace does) because Cargo forbids combining
# workspace-inherited lints with any additional local keys in the same
# [lints] table — so the workspace's clippy/rust lints are duplicated
# here rather than inherited.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
anndists = { version = "0.1", features = ["simdeez_f"] }
arrow.workspace = true
# Checked typed-slice casts for the `.seg` segment codec (u8 <-> u64/u32/f32).
# Already in this workspace's dependency graph via `arrow`, so this adds no
# new crate -- only a direct edge. Chosen over hand-rolled `from_le_bytes`
# loops because it makes the alignment precondition a checked API call
# rather than a comment.
bytemuck = "1"
# CRC32C (Castagnoli) for the segment header/body checksums the format
# requires (segment-format design doc section 1). Hardware-accelerated where
# available with a portable software fallback; no transitive runtime
# dependencies. `crc32fast` is NOT a substitute -- it implements CRC-32
# (IEEE), a different polynomial than the format specifies.
crc32c = "0.6"
thiserror.workspace = true

[dev-dependencies]
loom = "0.7"
