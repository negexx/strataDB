[package]
name = "strata-storage-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Pinned to the exact version the main workspace's Cargo.lock resolves
# (Arrow 58.3.0), not a bare "58". This fuzz workspace resolves its own
# independent lockfile, so the direct constraints are kept explicit.
# The fuzz target exercises the shipped storage parser, so the direct
# `arrow`/`arrow-ipc` constraints are pre-existing and intentional. The
# checked-in lockfile pins their transitively resolved Arrow family to the
# same 58.3.0 release without adding direct dependencies for unused sub-crates.
# Keep the aggregate constraints and lockfile in sync to prevent Arrow drift.
arrow = "=58.3.0"
arrow-ipc = "=58.3.0"

[dependencies.strata-storage]
path = "../crates/storage"

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datafile_parse"
path = "fuzz_targets/datafile_parse.rs"
test = false
doc = false
bench = false

[workspace]
