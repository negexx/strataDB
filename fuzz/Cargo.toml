[package]
name = "strata-storage-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
arrow = "58"

[dependencies.strata-storage]
path = "../crates/storage"

[dependencies.strata-index]
path = "../crates/index"

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delta_log_parse"
path = "fuzz_targets/delta_log_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datafile_parse"
path = "fuzz_targets/datafile_parse.rs"
test = false
doc = false
bench = false

[workspace]
