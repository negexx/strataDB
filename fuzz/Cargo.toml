[package]
name = "strata-storage-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Pinned to the exact version the main workspace's Cargo.lock resolves
# (arrow-rs 58.3.0), not a bare "58" -- this fuzz workspace resolves its own
# independent lockfile, and without the pin it drifted to 58.4.0, meaning a
# found-or-not-found IPC decode panic wouldn't actually transfer to the
# shipped binary. Pinning the aggregate `arrow` crate alone isn't enough --
# confirmed directly: with only that pin in place, `arrow-ipc` (a separate
# sub-crate `arrow`/`strata-storage` both pull in transitively) still
# independently resolved to 58.4.0 on a fresh lockfile. Pin each sub-crate
# actually exercised by a fuzz target explicitly, not just the aggregate.
arrow = "=58.3.0"
arrow-ipc = "=58.3.0"

[dependencies.strata-storage]
path = "../crates/storage"

[dependencies.strata-index]
path = "../crates/index"

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delta_log_parse"
path = "fuzz_targets/delta_log_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datafile_parse"
path = "fuzz_targets/datafile_parse.rs"
test = false
doc = false
bench = false

[workspace]
