name: Phase 1 portability evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-foundation-evidence:
    name: native foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      - name: Run native foundation regressions
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p artifacts
          log=artifacts/native-foundation.log
          status=0
          run_case() {
            label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              echo "+ $*"
              "$@"
            } 2>&1 | tee -a "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            if [ "${pipeline_status[0]}" -ne 0 ] || [ "${pipeline_status[1]}" -ne 0 ]; then
              status=1
              echo "===== $label FAILED (${pipeline_status[*]}) =====" | tee -a "$log"
            else
              echo "===== $label PASSED =====" | tee -a "$log"
            fi
          }

          run_case revision git rev-parse HEAD
          run_case runner printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          run_case system uname -a
          run_case rustc-version rustc -Vv
          run_case cargo-version cargo -Vv
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              certutil -hashfile "$1" SHA256
            fi
          }
          run_case lockfile hash_file Cargo.lock
          run_case storage-tests cargo test --locked -p strata-storage
          run_case directory-faults cargo test --locked -p strata-txn --features test-fault-injection
          run_case row-id-restart cargo test --locked -p strata-txn --features chaos-injection --test row_id_reservation_restart -- --nocapture
          run_case dataset-round-trip cargo test --locked -p strata-txn dataset::tests::insert_then_commit_then_scan_round_trips -- --exact
          run_case format cargo fmt --check

          exit "$status"

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-1-native-foundation-${{ matrix.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/native-foundation.log
          if-no-files-found: error
          retention-days: 14
