name: Phase 1 portability evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_fixture:
        description: "Download and smoke-test the pinned DBpedia fixture on supported runners"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REAL_FIXTURE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.real_fixture && 'true' || 'false' }}

jobs:
  native-foundation-evidence:
    name: native foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      - name: Run native foundation regressions
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p artifacts
          log=artifacts/native-foundation.log
          status=0
          run_case() {
            label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              echo "+ $*"
              "$@"
            } 2>&1 | tee -a "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            if [ "${pipeline_status[0]}" -ne 0 ] || [ "${pipeline_status[1]}" -ne 0 ]; then
              status=1
              echo "===== $label FAILED (${pipeline_status[*]}) =====" | tee -a "$log"
            else
              echo "===== $label PASSED =====" | tee -a "$log"
            fi
          }
          observe() {
            label="$1"
            shift
            {
              echo
              echo "===== observation: $label ====="
              echo "+ $*"
              "$@" || true
            } 2>&1 | tee -a "$log"
          }

          run_case revision git rev-parse HEAD
          run_case runner printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          run_case system uname -a
          observe filesystem df -T .
          observe cpu bash -c 'lscpu || powershell.exe -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List *"'
          observe ram bash -c 'grep -E "MemTotal|MemAvailable" /proc/meminfo || powershell.exe -NoProfile -Command "Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory"'
          run_case rustc-version rustc -Vv
          run_case cargo-version cargo -Vv
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              certutil -hashfile "$1" SHA256
            fi
          }
          run_case lockfile hash_file Cargo.lock
          {
            echo 'source_revision='"$(git rev-parse HEAD)"
            echo 'fixture_repo=Qdrant/dbpedia-entities-openai3-text-embedding-3-small-512-100K'
            echo 'fixture_revision=56e6849a3d0f7913e56b475bf92c0064c93b576d'
            echo 'fixture_file=data/train-00000-of-00001.parquet'
            echo 'fixture_size_bytes=363758493'
            echo 'fixture_sha256=5ea400d91cba9b27fa55fc659e48f7bda8cba68443f087a15ddbc0e42acd049d'
            echo 'seed=20260801'
            echo 'cache_policy=OS/filesystem caches are not forcibly flushed'
            echo 'synthetic_repetitions=1'
            echo 'fixture_repetitions=1'
          } | tee -a "$log"
          run_case synthetic-manifest env STRATA_GROWTH_COMMITS=10 STRATA_GROWTH_WARMUP_RUNS=1 STRATA_GROWTH_REPETITIONS=1 cargo bench --locked -p strata-bench --bench manifest_growth_bench -- --noplot
          run_case synthetic-segment-smoke env STRATA_BENCH_SOURCE=synthetic STRATA_BENCH_SEED=20260801 STRATA_SEG_ROWS=64 STRATA_SEG_QUERIES=4 STRATA_SEG_WARMUP_RUNS=1 STRATA_SEG_REPETITIONS=1 cargo bench --locked -p strata-bench --bench segment_recall_bench -- --noplot
          if [[ "$RUNNER_OS" == "Linux" && "$REAL_FIXTURE_REQUESTED" == "true" ]]; then
            fixture=bench/data/dbpedia-openai-100k.parquet
            mkdir -p bench/data
            run_case fixture-download curl --fail --location --retry 3 --output "$fixture" "https://huggingface.co/datasets/Qdrant/dbpedia-entities-openai3-text-embedding-3-small-512-100K/resolve/56e6849a3d0f7913e56b475bf92c0064c93b576d/data/train-00000-of-00001.parquet"
            run_case fixture-size bash -c "test \"\$(wc -c < '$fixture')\" = 363758493"
            run_case fixture-sha256 bash -c "test \"\$(sha256sum '$fixture' | awk '{print \$1}')\" = 5ea400d91cba9b27fa55fc659e48f7bda8cba68443f087a15ddbc0e42acd049d"
            run_case fixture-segment-smoke env STRATA_BENCH_SOURCE=fixture STRATA_BENCH_FIXTURE="$fixture" STRATA_SEG_ROWS=64 STRATA_SEG_QUERIES=4 STRATA_SEG_WARMUP_RUNS=1 STRATA_SEG_REPETITIONS=1 cargo bench --locked -p strata-bench --bench segment_recall_bench -- --noplot
          else
            echo "fixture_status=skipped (supported measurement runner is Ubuntu)" | tee -a "$log"
          fi
          run_case storage-tests cargo test --locked -p strata-storage
          run_case directory-faults cargo test --locked -p strata-txn --features test-fault-injection
          run_case row-id-restart cargo test --locked -p strata-txn --features chaos-injection --test row_id_reservation_restart -- --nocapture
          run_case dataset-round-trip cargo test --locked -p strata-txn dataset::tests::insert_then_commit_then_scan_round_trips -- --exact
          run_case format cargo fmt --check

          exit "$status"

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-1-native-foundation-${{ matrix.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/native-foundation.log
          if-no-files-found: error
          retention-days: 14
