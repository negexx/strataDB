name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-directory-durability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Initialize Windows platform/restart provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          @(
            "revision=$(git rev-parse HEAD)",
            "workflow=$env:GITHUB_WORKFLOW",
            "run.id=$env:GITHUB_RUN_ID",
            "run.attempt=$env:GITHUB_RUN_ATTEMPT",
            "event=$env:GITHUB_EVENT_NAME",
            "ref=$env:GITHUB_REF",
            "runner.os=$env:RUNNER_OS",
            "runner.arch=$env:RUNNER_ARCH",
            "runner.name=$env:RUNNER_NAME",
            "workspace=$env:GITHUB_WORKSPACE",
            "command=cargo test -p strata-txn --features chaos-injection --test row_id_reservation_restart -- --nocapture"
          ) | Set-Content -Path artifacts/windows-platform-restart-evidence.log
          rustc -Vv | Add-Content -Path artifacts/windows-platform-restart-evidence.log
          cargo -Vv | Add-Content -Path artifacts/windows-platform-restart-evidence.log

      - name: Test storage directory durability
        run: cargo test -p strata-storage

      - name: Test default dataset create and round trip
        run: cargo test -p strata-txn dataset::tests::insert_then_commit_then_scan_round_trips -- --exact

      - name: Test injected dataset creation durability boundary
        run: cargo test -p strata-txn --features test-fault-injection dataset::tests::create_returns_an_error_when_manifest_publication_root_sync_fails -- --exact

      - name: Test row-ID reservation restart durability
        id: windows_row_id_restart
        shell: pwsh
        run: |
          & cargo test -p strata-txn --features chaos-injection --test row_id_reservation_restart -- --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/windows-platform-restart-evidence.log -Append
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Retain Windows platform/restart evidence
        id: retain_windows_restart_evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-platform-restart-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/windows-platform-restart-evidence.log
          if-no-files-found: error
          retention-days: 90

      - name: Clippy directory durability fault injection
        run: cargo clippy -p strata-txn --all-targets --features test-fault-injection -- -D warnings

      - name: Format check
        run: cargo fmt --check

  phase-0-foundation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"

      - name: Run retained Phase 0 foundation regressions
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p artifacts
          log=artifacts/phase-0-foundation.log
          status=0
          run_case() {
            label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              echo "+ $*"
              "$@"
            } 2>&1 | tee -a "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            if [ "${pipeline_status[0]}" -ne 0 ] || [ "${pipeline_status[1]}" -ne 0 ]; then
              status=1
              echo "===== $label FAILED (${pipeline_status[*]}) =====" | tee -a "$log"
            else
              echo "===== $label PASSED =====" | tee -a "$log"
            fi
          }

          run_case revision git rev-parse HEAD
          run_case runner-os printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          run_case system uname -a
          run_case rustc-version rustc -Vv
          run_case cargo-version cargo -Vv

          run_case row-id-restart \
            cargo test -p strata-txn --features chaos-injection --test row_id_reservation_restart -- --nocapture
          run_case manifest-checksum-rejection \
            cargo test -p strata-storage --lib manifest::tests::read_current_rejects_a_manifest_with_a_mutated_checksum -- --exact
          run_case manifest-format-version-rejection \
            cargo test -p strata-storage --lib manifest::tests::read_current_rejects_an_unsupported_manifest_format_version -- --exact
          run_case manifest-legacy-rejection \
            cargo test -p strata-storage --lib manifest::tests::read_current_rejects_a_legacy_unenveloped_manifest -- --exact
          run_case arrow-row-file-round-trip \
            cargo test -p strata-storage --lib datafile::tests::write_then_read_round_trips -- --exact
          run_case immutable-segment-round-trip \
            cargo test -p strata-index --lib segment_reader::tests::every_nodes_level_vector_and_neighbor_list_survives_the_round_trip -- --exact
          run_case immutable-segment-format-rejection \
            cargo test -p strata-index --lib segment_reader::tests::a_wrong_magic_or_format_version_is_rejected_before_anything_else_is_read -- --exact

          exit "$status"

      - name: Retain Phase 0 foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-0-foundation-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/phase-0-foundation.log
          if-no-files-found: error
          retention-days: 90

  phase-3-lifecycle-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"

      - name: Run Phase 3 manifest-retention crash recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            set -x
            printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            uname -a
            rustc -Vv
            cargo -Vv
            cargo test -p strata-txn --no-default-features --test retention_age --test vacuum --test maintenance -- --nocapture
            cargo test -p strata-txn --features chaos-injection --test manifest_retention_executor -- --exact manifest_prune_abort_before_directory_sync_preserves_latest_recovery --nocapture
            STRATA_BENCH_SOURCE=synthetic STRATA_BENCH_SEED=20260801 STRATA_LIFECYCLE_ROWS=64 STRATA_LIFECYCLE_BATCH_ROWS=8 cargo bench -p strata-bench --bench lifecycle_bench --no-default-features
          } 2>&1 | tee artifacts/phase-3-lifecycle-evidence.log

      - name: Retain Phase 3 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-3-lifecycle-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/phase-3-lifecycle-evidence.log
          if-no-files-found: error
          retention-days: 90

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize CI provenance
        id: initialize_provenance
        shell: bash
        run: |
          set -euo pipefail
          provenance_dir="$RUNNER_TEMP/strata-ci-provenance"
          mkdir -p "$provenance_dir"
          log="$provenance_dir/ci-provenance.log"
          {
            printf 'revision=unavailable\n'
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'run.id=%s\nrun.attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'event=%s\nref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF"
            printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            uname -a
          } > "$log"
          cat > "$provenance_dir/ci-provenance.bash_env" <<EOF
          exec 19>>"$log"
          export BASH_XTRACEFD=19
          export PS4='+ \${BASH_SOURCE}:\${LINENO}: '
          set -x
          EOF
          printf 'STRATA_PROVENANCE_DIR=%s\nBASH_ENV=%s\n' \
            "$provenance_dir" "$provenance_dir/ci-provenance.bash_env" >> "$GITHUB_ENV"

      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        id: install_toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Record repository and toolchain provenance
        id: record_provenance
        if: always()
        shell: bash
        run: |
          set +e
          provenance_dir="${STRATA_PROVENANCE_DIR:-$RUNNER_TEMP/strata-ci-provenance}"
          mkdir -p "$provenance_dir"
          log="$provenance_dir/ci-provenance.log"
          {
            if revision=$(git rev-parse HEAD 2>/dev/null); then
              sed -i "s/^revision=.*/revision=$revision/" "$log"
            else
              printf 'revision=unavailable\n' >> "$log"
            fi
            if command -v rustc >/dev/null 2>&1; then rustc -Vv; else printf 'rustc=unavailable\n'; fi
            if command -v cargo >/dev/null 2>&1; then cargo -Vv; else printf 'cargo=unavailable\n'; fi
            if [ -f Cargo.lock ]; then sha256sum Cargo.lock; else printf 'Cargo.lock=unavailable\n'; fi
          } >> "$log"

      - name: Build
        id: build
        run: cargo build --workspace

      - name: Test
        id: test
        # The bindings crate enables PyO3's extension-module feature by
        # default for packaging. Native Rust test binaries must disable that
        # feature so PyO3 links the interpreter symbols they exercise.
        run: cargo test --workspace --no-default-features

      - name: Test (parallel-insert feature)
        id: test_parallel
        # `insert_batch_parallel`'s clustered-data recall hazard fix is
        # exercised end-to-end through `crates/txn`'s commit path only when
        # this feature is on --
        # `cargo test --workspace` above never enables it, since it's off
        # by default (`crates/txn/Cargo.toml`).
        run: cargo test -p strata-txn --features parallel-insert

      - name: Test (directory durability fault injection)
        id: test_fault_injection
        # Dataset creation's ordered directory-sync boundaries use this
        # thread-local fault seam. The default workspace suite intentionally
        # does not compile this test-only feature, so run it explicitly.
        run: cargo test -p strata-txn --features test-fault-injection

      - name: Test chaos checkpoint abort
        id: chaos_checkpoint
        run: cargo test -p strata-storage --features chaos-injection --test chaos_checkpoint_actually_aborts -- --exact commit_manifest_aborts_at_the_configured_checkpoint

      - name: Test fast chaos tier
        id: chaos_fast
        run: cargo test -p strata-sim fast_tier_random_seeds_survive_random_crash_points -- --exact --nocapture

      - name: Loom transaction models (strata-txn)
        id: loom_txn
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            cargo rustc -p strata-txn --lib --profile test --message-format=json -- --cfg loom \
              | tee /tmp/loom-txn-build.json
            bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-txn-build.json | tail -1)
            if [ -z "$bin" ]; then
              echo "::error::no test binary produced by the --cfg loom build"
              exit 1
            fi
            models=(
              dataset::loom_tests::one_writer_store_races_safely_with_many_readers_load
              dataset::loom_tests::two_threads_deleting_the_same_row_exactly_one_conflicts
              dataset::loom_tests::two_threads_deleting_disjoint_rows_both_succeed
              dataset::loom_tests::a_failed_commits_segment_is_never_searchable_under_concurrent_commits
              dataset::loom_tests::concurrent_first_vector_commits_at_different_dimensions_are_not_both_accepted
              dataset::loom_tests::a_failed_commits_segment_is_never_visible_to_a_concurrent_reader
              dataset::loom_tests::a_commits_row_and_its_segment_become_visible_as_one_atomic_step
              dataset::loom_tests::a_reader_never_sees_one_in_flight_commits_row_while_observing_an_unrelated_commits_row_id_counter
              dataset::loom_tests::transaction_read_overlay_stays_private_while_disjoint_and_contested_writes_commit
              dataset::loom_tests::migration_exclusivity_rejects_a_stale_schema_commit_or_migrates_its_published_rows
              row_id::loom_tests::concurrent_claims_publish_monotonic_high_water
              retention::loom_tests::concurrent_registration_and_final_drop_prune_after_quiescence
              lifecycle_coordination::loom_tests::preparation_and_exclusive_execution_never_overlap
              dataset::loom_tests::indeterminate_reconciliation_precedes_readers_and_a_subsequent_publisher
            )
            for model in "${models[@]}"; do
              "$bin" --list --format terse | grep -Fx "${model}: test"
              "$bin" --exact "$model" --test-threads=1
            done
            semantic_model=dataset::loom_tests::immutable_snapshot_membership_controls_visibility_despite_claimed_high_water
            "$bin" --list --format terse | grep -Fx "${semantic_model}: test"
            "$bin" --exact "$semantic_model" --test-threads=1
          } 2>&1 | tee artifacts/loom-txn-evidence.log

      - name: Loom live-set-cache model (strata-txn)
        id: loom_cache
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            cargo rustc -p strata-txn --lib --profile test --message-format=json -- --cfg loom \
              | tee /tmp/loom-txn-cache-build.json
            bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-txn-cache-build.json | tail -1)
            if [ -z "$bin" ]; then
              echo "::error::no test binary produced by the --cfg loom build"
              exit 1
            fi
            models=(
              live_set_cache::loom_tests::two_concurrent_misses_on_the_same_key_compute_exactly_once
              live_set_cache::loom_tests::concurrent_different_key_payloads_do_not_exceed_the_budget
              live_set_cache::loom_tests::concurrent_different_key_entry_charges_do_not_exceed_the_budget
            )
            for model in "${models[@]}"; do
              "$bin" --list --format terse | grep -Fx "${model}: test"
              "$bin" --exact "$model" --test-threads=1
            done
          } 2>&1 | tee artifacts/loom-txn-cache-evidence.log

      - name: Loom tests (strata-index)
        id: loom_index
        # Scoped to this one crate rather than a workspace-wide
        # `RUSTFLAGS=--cfg loom cargo test`; AGENTS.md explains why that
        # would break other crates in the dependency graph. These exact model
        # names are the CI-visible regression gate for the publication-barrier
        # fix (`EntryPoint::claim_if_empty`, `Node::is_published`/
        # `mark_published`) and the supporting index concurrency invariants.
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            cargo rustc -p strata-index --lib --profile test --message-format=json -- --cfg loom \
              | tee /tmp/loom-index-build.json
            bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-index-build.json | tail -1)
            if [ -z "$bin" ]; then
              echo "::error::no test binary produced by the --cfg loom build"
              exit 1
            fi
            models=(
              node::loom_tests::full_node_publish_is_completely_visible_to_a_reader
              node_table::loom_tests::concurrent_chunk_allocation_publishes_exactly_one_chunk
              slot_array::loom_tests::concurrent_claim_and_shrink_never_corrupts_a_slot
              graph::loom_tests::concurrent_advances_always_settle_on_the_highest_level
              graph::loom_tests::concurrent_inserts_of_distinct_rows_are_all_findable_and_uncorrupted
              graph::loom_tests::concurrent_inserts_racing_on_one_shared_neighbor_always_keep_the_nearest
              graph::loom_tests::physical_claim_exhaustion_retries_before_pruning
              graph::loom_tests::concurrent_inserts_into_a_genuinely_empty_graph_never_strand_a_node_loom
              graph::loom_tests::concurrent_insert_never_uses_an_unpublished_node_as_a_descent_entry_loom
            )
            for model in "${models[@]}"; do
              "$bin" --list --format terse | grep -Fx "${model}: test"
              "$bin" --exact "$model" --test-threads=1
            done
          } 2>&1 | tee artifacts/loom-index-evidence.log

      - name: Retain loom evidence
        id: retain_loom
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loom-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/loom-*.log
          if-no-files-found: error
          retention-days: 90

      - name: Clippy
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (parallel-insert feature)
        id: clippy_parallel
        run: cargo clippy -p strata-txn --all-targets --features parallel-insert -- -D warnings

      - name: Clippy (directory durability fault injection)
        id: clippy_fault_injection
        run: cargo clippy -p strata-txn --all-targets --features test-fault-injection -- -D warnings

      - name: Verify facade and package boundaries
        id: facade
        run: |
          set -euo pipefail
          test ! -d docs/superpowers
          cargo metadata --no-deps --format-version 1 > /tmp/strata-metadata.json
          jq -e '
            . as $metadata
            | (($metadata.workspace_members | length) > 0)
              and all(
                $metadata.workspace_members[];
                . as $workspace_member
                | any($metadata.packages[]; .id == $workspace_member and .publish == [])
              )
          ' /tmp/strata-metadata.json
          deleted_tree_roots=(docs/superpowers docs/design)
          deleted_tree_suffix=/
          for deleted_tree_root in "${deleted_tree_roots[@]}"; do
            ! git grep -n -F "${deleted_tree_root}${deleted_tree_suffix}" -- . ':(exclude)docs/phase-1-implementation-plan.md'
          done
          ! rg -n "no dataset-owned schema|target semantics remain open|restart-safe non-reuse.*unresolved|all newly-created ancestor" \
            docs/status.md docs/architecture.md docs/design.md

      - name: Format check
        id: format
        run: cargo fmt --check

      - name: Doc
        id: doc
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        id: install_deny
        uses: taiki-e/install-action@f1d783a3a0ed7012c43e2889fbe3519390e9025b # cargo-deny
        with:
          tool: cargo-deny

      - name: cargo-deny (bans, sources, advisories)
        id: deny
        run: cargo deny check bans sources advisories

      - name: Finalize CI provenance
        if: always()
        shell: bash
        run: |
          set +x
          provenance_dir="${STRATA_PROVENANCE_DIR:-$RUNNER_TEMP/strata-ci-provenance}"
          mkdir -p "$provenance_dir"
          log="$provenance_dir/ci-provenance.log"
          touch "$log"
          {
            printf 'step.initialize_provenance=%s\n' '${{ steps.initialize_provenance.outcome }}'
            printf 'step.checkout=%s\n' '${{ steps.checkout.outcome }}'
            printf 'step.install_toolchain=%s\n' '${{ steps.install_toolchain.outcome }}'
            printf 'step.record_provenance=%s\n' '${{ steps.record_provenance.outcome }}'
            printf 'job.status=%s\n' '${{ job.status }}'
            printf 'step.build=%s\n' '${{ steps.build.outcome }}'
            printf 'step.test=%s\n' '${{ steps.test.outcome }}'
            printf 'step.test_parallel=%s\n' '${{ steps.test_parallel.outcome }}'
            printf 'step.test_fault_injection=%s\n' '${{ steps.test_fault_injection.outcome }}'
            printf 'step.chaos_checkpoint=%s\n' '${{ steps.chaos_checkpoint.outcome }}'
            printf 'step.chaos_fast=%s\n' '${{ steps.chaos_fast.outcome }}'
            printf 'step.loom_txn=%s\n' '${{ steps.loom_txn.outcome }}'
            printf 'step.loom_cache=%s\n' '${{ steps.loom_cache.outcome }}'
            printf 'step.loom_index=%s\n' '${{ steps.loom_index.outcome }}'
            printf 'step.retain_loom=%s\n' '${{ steps.retain_loom.outcome }}'
            printf 'step.clippy=%s\n' '${{ steps.clippy.outcome }}'
            printf 'step.clippy_parallel=%s\n' '${{ steps.clippy_parallel.outcome }}'
            printf 'step.clippy_fault_injection=%s\n' '${{ steps.clippy_fault_injection.outcome }}'
            printf 'step.facade=%s\n' '${{ steps.facade.outcome }}'
            printf 'step.format=%s\n' '${{ steps.format.outcome }}'
            printf 'step.doc=%s\n' '${{ steps.doc.outcome }}'
            printf 'step.install_deny=%s\n' '${{ steps.install_deny.outcome }}'
            printf 'step.deny=%s\n' '${{ steps.deny.outcome }}'
          } >> "$log"
          cat "$log"

      - name: Upload CI provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-provenance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-ci-provenance/ci-provenance.log
          if-no-files-found: error
          retention-days: 90

  fuzz-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"

      - name: Build declared fuzz targets and run parser smoke inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            set -x
            printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            uname -a
            rustup show active-toolchain
            rustc -Vv
            cargo -Vv
            sha256sum Cargo.lock fuzz/Cargo.lock

            rustup toolchain install nightly-2026-07-25 --profile minimal
            rustc +nightly-2026-07-25 -Vv
            cargo +nightly-2026-07-25 -Vv
            cargo +nightly-2026-07-25 install cargo-fuzz --version 0.13.2 --locked
            cargo +nightly-2026-07-25 fuzz --version

            fuzz_lock_sha_before="$(sha256sum fuzz/Cargo.lock | awk '{print $1}')"
            printf 'fuzz.Cargo.lock.sha256.before=%s\n' "$fuzz_lock_sha_before"
            cd fuzz
            targets="$(cargo +nightly-2026-07-25 fuzz list | sort)"
            test "$targets" = $'datafile_parse\nmanifest_current_parse\nmanifest_parse\nsegment_parse'
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz build manifest_parse
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz build datafile_parse
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz build manifest_current_parse
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz build segment_parse
            sha256sum Cargo.lock
            fuzz_lock_sha_after="$(sha256sum Cargo.lock | awk '{print $1}')"
            printf 'fuzz.Cargo.lock.sha256.after=%s\n' "$fuzz_lock_sha_after"
            if ! test "$fuzz_lock_sha_before" = "$fuzz_lock_sha_after"; then
              echo "::error::cargo +nightly-2026-07-25 fuzz build modified checked-in fuzz/Cargo.lock (before=$fuzz_lock_sha_before after=$fuzz_lock_sha_after)"
              exit 1
            fi

            for input in corpus/datafile_parse/*.arrow; do
              test -f "$input"
              CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz run datafile_parse "$input" -- -runs=1 -seed=24740
            done
            printf '%s\n' '{"version":0}' > "$RUNNER_TEMP/manifest-parse-smoke.json"
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz run manifest_parse "$RUNNER_TEMP/manifest-parse-smoke.json" -- -runs=1 -seed=24740
            printf '%s\n' '{"version":0}' > "$RUNNER_TEMP/manifest-current-parse-smoke.json"
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz run manifest_current_parse "$RUNNER_TEMP/manifest-current-parse-smoke.json" -- -runs=1 -seed=24740
            printf '%s' 'strata-segment-smoke' > "$RUNNER_TEMP/segment-parse-smoke.seg"
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz run segment_parse "$RUNNER_TEMP/segment-parse-smoke.seg" -- -runs=1 -seed=24740
          } 2>&1 | tee artifacts/fuzz-provenance.log

      - name: Retain fuzz provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-provenance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/fuzz-provenance.log
          if-no-files-found: error
          retention-days: 90

  thorough-chaos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"

      - name: Test thorough chaos tier
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            set -x
            printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            uname -a
            rustup show active-toolchain
            rustc -Vv
            cargo -Vv
            sha256sum Cargo.lock

            CARGO_BUILD_JOBS=1 STRATA_CHAOS_THOROUGH=1 cargo test -p strata-sim thorough_tier_satisfies_the_phase_7_exit_criterion -- --exact --ignored --nocapture
          } 2>&1 | tee artifacts/strata-chaos-thorough.log
          grep -F "thorough tier: 2000/2000 seeds checked" artifacts/strata-chaos-thorough.log

      - name: Retain thorough chaos log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thorough-chaos-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strata-chaos-thorough.log
          if-no-files-found: error
          retention-days: 90

  audit4-concurrency-arm64:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"
      - name: Run Audit 4 ARM64 concurrency evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          log=artifacts/audit4-arm64.log
          {
            printf 'revision=%s\nrunner.os=%s\nrunner.arch=%s\n' "$(git rev-parse HEAD)" "$RUNNER_OS" "$RUNNER_ARCH"
            rustc -Vv
            cargo -Vv
          } 2>&1 | tee "$log"
          set +e
          status=0
          run_case() {
            label="$1"; shift
            echo "===== $label =====" | tee -a "$log"
            set -x
            "$@" 2>&1 | tee -a "$log"
            command_status=(${PIPESTATUS[@]})
            set +x
            if [ "${command_status[0]}" -ne 0 ] || [ "${command_status[1]}" -ne 0 ]; then status=1; fi
          }
          run_case snapshot-isolation cargo test -p strata-txn --no-default-features --test concurrent_snapshot_isolation
          run_case production-stress env STRATA_CONCURRENCY_STRESS_COMMITS=128 cargo test -p strata-txn --no-default-features --test concurrency_stress shared_dataset_publication_stress_preserves_complete_snapshots -- --exact --ignored --nocapture
          grep -F 'AUDIT4_CONCURRENCY_STRESS_COMPLETE' "$log" >/dev/null || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit4-arm64-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/audit4-arm64.log
          if-no-files-found: error
          retention-days: 90

  audit4-concurrency-tsan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: nightly-2026-07-25
          components: rust-src
      - name: Run Audit 4 ThreadSanitizer concurrency evidence
        shell: bash
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          log=artifacts/audit4-tsan.log
          {
            printf 'revision=%s\nrunner.os=%s\nrunner.arch=%s\n' "$(git rev-parse HEAD)" "$RUNNER_OS" "$RUNNER_ARCH"
            rustc +nightly-2026-07-25 -Vv
            cargo +nightly-2026-07-25 -Vv
          } 2>&1 | tee "$log"
          set +e
          status=0
          run_case() {
            label="$1"; shift
            echo "===== $label =====" | tee -a "$log"
            set -x
            "$@" 2>&1 | tee -a "$log"
            command_status=(${PIPESTATUS[@]})
            set +x
            if [ "${command_status[0]}" -ne 0 ] || [ "${command_status[1]}" -ne 0 ]; then status=1; fi
          }
          run_case snapshot-isolation cargo +nightly-2026-07-25 test -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-txn --no-default-features --test concurrent_snapshot_isolation
          run_case production-stress env STRATA_CONCURRENCY_STRESS_COMMITS=128 cargo +nightly-2026-07-25 test -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-txn --no-default-features --test concurrency_stress shared_dataset_publication_stress_preserves_complete_snapshots -- --exact --ignored --nocapture --test-threads=1
          grep -F 'AUDIT4_CONCURRENCY_STRESS_COMPLETE' "$log" >/dev/null || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit4-tsan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/audit4-tsan.log
          if-no-files-found: error
          retention-days: 90
