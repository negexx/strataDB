name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-directory-durability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      - name: Test storage directory durability
        run: cargo test -p strata-storage

      - name: Test default dataset create and round trip
        run: cargo test -p strata-txn dataset::tests::insert_then_commit_then_scan_round_trips -- --exact

      - name: Test injected dataset creation durability boundary
        run: cargo test -p strata-txn --features test-fault-injection dataset::tests::create_returns_an_error_when_manifest_publication_root_sync_fails -- --exact

      - name: Clippy directory durability fault injection
        run: cargo clippy -p strata-txn --all-targets --features test-fault-injection -- -D warnings

      - name: Format check
        run: cargo fmt --check

  phase-0-foundation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"

      - name: Run retained Phase 0 foundation regressions
        shell: bash
        run: |
          set -o pipefail
          set +e
          mkdir -p artifacts
          log=artifacts/phase-0-foundation.log
          status=0
          run_case() {
            label="$1"
            shift
            {
              echo
              echo "===== $label ====="
              echo "+ $*"
              "$@"
            } 2>&1 | tee -a "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            if [ "${pipeline_status[0]}" -ne 0 ] || [ "${pipeline_status[1]}" -ne 0 ]; then
              status=1
              echo "===== $label FAILED (${pipeline_status[*]}) =====" | tee -a "$log"
            else
              echo "===== $label PASSED =====" | tee -a "$log"
            fi
          }

          run_case revision git rev-parse HEAD
          run_case runner-os printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          run_case system uname -a
          run_case rustc-version rustc -Vv
          run_case cargo-version cargo -Vv

          run_case row-id-restart \
            cargo test -p strata-txn --features chaos-injection --test row_id_reservation_restart -- --nocapture
          run_case manifest-checksum-rejection \
            cargo test -p strata-storage --lib manifest::tests::read_current_rejects_a_manifest_with_a_mutated_checksum -- --exact
          run_case manifest-format-version-rejection \
            cargo test -p strata-storage --lib manifest::tests::read_current_rejects_an_unsupported_manifest_format_version -- --exact
          run_case manifest-legacy-rejection \
            cargo test -p strata-storage --lib manifest::tests::read_current_rejects_a_legacy_unenveloped_manifest -- --exact
          run_case arrow-row-file-round-trip \
            cargo test -p strata-storage --lib datafile::tests::write_then_read_round_trips -- --exact
          run_case immutable-segment-round-trip \
            cargo test -p strata-index --lib segment_reader::tests::every_nodes_level_vector_and_neighbor_list_survives_the_round_trip -- --exact
          run_case immutable-segment-format-rejection \
            cargo test -p strata-index --lib segment_reader::tests::a_wrong_magic_or_format_version_is_rejected_before_anything_else_is_read -- --exact

          exit "$status"

      - name: Retain Phase 0 foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-0-foundation-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/phase-0-foundation.log
          if-no-files-found: error
          retention-days: 14

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Test (parallel-insert feature)
        # `insert_batch_parallel`'s clustered-data recall hazard fix is
        # exercised end-to-end through `crates/txn`'s commit path only when
        # this feature is on --
        # `cargo test --workspace` above never enables it, since it's off
        # by default (`crates/txn/Cargo.toml`).
        run: cargo test -p strata-txn --features parallel-insert

      - name: Test (directory durability fault injection)
        # Dataset creation's ordered directory-sync boundaries use this
        # thread-local fault seam. The default workspace suite intentionally
        # does not compile this test-only feature, so run it explicitly.
        run: cargo test -p strata-txn --features test-fault-injection

      - name: Test chaos checkpoint abort
        run: cargo test -p strata-storage --features chaos-injection --test chaos_checkpoint_actually_aborts -- --exact commit_manifest_aborts_at_the_configured_checkpoint

      - name: Test fast chaos tier
        run: cargo test -p strata-sim fast_tier_random_seeds_survive_random_crash_points -- --exact --nocapture

      - name: Loom transaction models (strata-txn)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            cargo rustc -p strata-txn --lib --profile test --message-format=json -- --cfg loom \
              | tee /tmp/loom-txn-build.json
            bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-txn-build.json | tail -1)
            if [ -z "$bin" ]; then
              echo "::error::no test binary produced by the --cfg loom build"
              exit 1
            fi
            models=(
              dataset::loom_tests::one_writer_store_races_safely_with_many_readers_load
              dataset::loom_tests::two_threads_deleting_the_same_row_exactly_one_conflicts
              dataset::loom_tests::two_threads_deleting_disjoint_rows_both_succeed
              dataset::loom_tests::a_failed_commits_segment_is_never_searchable_under_concurrent_commits
              dataset::loom_tests::concurrent_first_vector_commits_at_different_dimensions_are_not_both_accepted
              dataset::loom_tests::a_failed_commits_segment_is_never_visible_to_a_concurrent_reader
              dataset::loom_tests::a_commits_row_and_its_segment_become_visible_as_one_atomic_step
              dataset::loom_tests::a_reader_never_sees_one_in_flight_commits_row_while_observing_an_unrelated_commits_row_id_counter
              row_id::loom_tests::concurrent_claims_publish_monotonic_high_water
            )
            for model in "${models[@]}"; do
              "$bin" --list --format terse | grep -Fx "${model}: test"
              "$bin" --exact "$model" --test-threads=1
            done
            semantic_model=dataset::loom_tests::immutable_snapshot_membership_controls_visibility_despite_claimed_high_water
            "$bin" --list --format terse | grep -Fx "${semantic_model}: test"
            "$bin" --exact "$semantic_model" --test-threads=1
          } 2>&1 | tee artifacts/loom-txn-evidence.log

      - name: Loom live-set-cache model (strata-txn)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            cargo rustc -p strata-txn --lib --profile test --message-format=json -- --cfg loom \
              | tee /tmp/loom-txn-cache-build.json
            bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-txn-cache-build.json | tail -1)
            if [ -z "$bin" ]; then
              echo "::error::no test binary produced by the --cfg loom build"
              exit 1
            fi
            model=live_set_cache::loom_tests::two_concurrent_misses_on_the_same_key_compute_exactly_once
            "$bin" --list --format terse | grep -Fx "${model}: test"
            "$bin" --exact "$model" --test-threads=1
          } 2>&1 | tee artifacts/loom-txn-cache-evidence.log

      - name: Loom tests (strata-index)
        # Scoped to this one crate rather than a workspace-wide
        # `RUSTFLAGS=--cfg loom cargo test`; AGENTS.md explains why that
        # would break other crates in the dependency graph. These exact model
        # names are the CI-visible regression gate for the publication-barrier
        # fix (`EntryPoint::claim_if_empty`, `Node::is_published`/
        # `mark_published`) and the supporting index concurrency invariants.
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            cargo rustc -p strata-index --lib --profile test --message-format=json -- --cfg loom \
              | tee /tmp/loom-index-build.json
            bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-index-build.json | tail -1)
            if [ -z "$bin" ]; then
              echo "::error::no test binary produced by the --cfg loom build"
              exit 1
            fi
            models=(
              node::loom_tests::full_node_publish_is_completely_visible_to_a_reader
              node_table::loom_tests::concurrent_chunk_allocation_publishes_exactly_one_chunk
              slot_array::loom_tests::concurrent_claim_and_shrink_never_corrupts_a_slot
              graph::loom_tests::concurrent_advances_always_settle_on_the_highest_level
              graph::loom_tests::concurrent_inserts_of_distinct_rows_are_all_findable_and_uncorrupted
              graph::loom_tests::concurrent_inserts_racing_on_one_shared_neighbor_always_keep_the_nearest
              graph::loom_tests::concurrent_inserts_into_a_genuinely_empty_graph_never_strand_a_node_loom
              graph::loom_tests::concurrent_insert_never_uses_an_unpublished_node_as_a_descent_entry_loom
            )
            for model in "${models[@]}"; do
              "$bin" --list --format terse | grep -Fx "${model}: test"
              "$bin" --exact "$model" --test-threads=1
            done
          } 2>&1 | tee artifacts/loom-index-evidence.log

      - name: Retain loom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loom-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/loom-*.log
          if-no-files-found: error
          retention-days: 14

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (parallel-insert feature)
        run: cargo clippy -p strata-txn --all-targets --features parallel-insert -- -D warnings

      - name: Clippy (directory durability fault injection)
        run: cargo clippy -p strata-txn --all-targets --features test-fault-injection -- -D warnings

      - name: Verify facade and package boundaries
        run: |
          set -euo pipefail
          test ! -d docs/superpowers
          cargo metadata --no-deps --format-version 1 > /tmp/strata-metadata.json
          jq -e '
            . as $metadata
            | (($metadata.workspace_members | length) > 0)
              and all(
                $metadata.workspace_members[];
                . as $workspace_member
                | any($metadata.packages[]; .id == $workspace_member and .publish == [])
              )
          ' /tmp/strata-metadata.json
          deleted_tree_roots=(docs/superpowers docs/design)
          deleted_tree_suffix=/
          for deleted_tree_root in "${deleted_tree_roots[@]}"; do
            ! git grep -n -F "${deleted_tree_root}${deleted_tree_suffix}" -- . ':(exclude)docs/phase-1-implementation-plan.md'
          done
          ! rg -n "no dataset-owned schema|target semantics remain open|restart-safe non-reuse.*unresolved|all newly-created ancestor" \
            docs/status.md docs/architecture.md docs/design.md

      - name: Format check
        run: cargo fmt --check

      - name: Doc
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        uses: taiki-e/install-action@f1d783a3a0ed7012c43e2889fbe3519390e9025b # cargo-deny
        with:
          tool: cargo-deny

      - name: cargo-deny (bans, sources, advisories)
        run: cargo deny check bans sources advisories

  fuzz-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"

      - name: Build declared fuzz targets and run parser smoke inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            set -x
            printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            uname -a
            rustup show active-toolchain
            rustc -Vv
            cargo -Vv
            sha256sum Cargo.lock fuzz/Cargo.lock

            rustup toolchain install nightly-2026-07-25 --profile minimal
            rustc +nightly-2026-07-25 -Vv
            cargo +nightly-2026-07-25 -Vv
            cargo +nightly-2026-07-25 install cargo-fuzz --version 0.13.2 --locked
            cargo +nightly-2026-07-25 fuzz --version

            fuzz_lock_sha_before="$(sha256sum fuzz/Cargo.lock | awk '{print $1}')"
            printf 'fuzz.Cargo.lock.sha256.before=%s\n' "$fuzz_lock_sha_before"
            cd fuzz
            targets="$(cargo +nightly-2026-07-25 fuzz list | sort)"
            test "$targets" = $'datafile_parse\nmanifest_parse'
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz build manifest_parse
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz build datafile_parse
            sha256sum Cargo.lock
            fuzz_lock_sha_after="$(sha256sum Cargo.lock | awk '{print $1}')"
            printf 'fuzz.Cargo.lock.sha256.after=%s\n' "$fuzz_lock_sha_after"
            if ! test "$fuzz_lock_sha_before" = "$fuzz_lock_sha_after"; then
              echo "::error::cargo +nightly-2026-07-25 fuzz build modified checked-in fuzz/Cargo.lock (before=$fuzz_lock_sha_before after=$fuzz_lock_sha_after)"
              exit 1
            fi

            for input in corpus/datafile_parse/*.arrow; do
              test -f "$input"
              CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz run datafile_parse "$input" -- -runs=1 -seed=24740
            done
            printf '%s\n' '{"version":0}' > "$RUNNER_TEMP/manifest-parse-smoke.json"
            CARGO_BUILD_JOBS=1 cargo +nightly-2026-07-25 fuzz run manifest_parse "$RUNNER_TEMP/manifest-parse-smoke.json" -- -runs=1 -seed=24740
          } 2>&1 | tee artifacts/fuzz-provenance.log

      - name: Retain fuzz provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-provenance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/fuzz-provenance.log
          if-no-files-found: error
          retention-days: 14

  thorough-chaos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.90"

      - name: Test thorough chaos tier
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            set -x
            printf 'runner.os=%s\nrunner.arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            uname -a
            rustup show active-toolchain
            rustc -Vv
            cargo -Vv
            sha256sum Cargo.lock

            CARGO_BUILD_JOBS=1 STRATA_CHAOS_THOROUGH=1 cargo test -p strata-sim thorough_tier_satisfies_the_phase_7_exit_criterion -- --exact --ignored --nocapture
          } 2>&1 | tee artifacts/strata-chaos-thorough.log
          grep -F "thorough tier: 2000/2000 seeds checked" artifacts/strata-chaos-thorough.log

      - name: Retain thorough chaos log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thorough-chaos-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/strata-chaos-thorough.log
          if-no-files-found: error
          retention-days: 14
