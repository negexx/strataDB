name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Test (parallel-insert feature)
        # `insert_batch_parallel`'s clustered-data recall hazard fix (see
        # `.opencode/rules/vector-index.md`) is only exercised end-to-end
        # through `crates/txn`'s commit path when this feature is on --
        # `cargo test --workspace` above never enables it, since it's off
        # by default (`crates/txn/Cargo.toml`).
        run: cargo test -p strata-txn --features parallel-insert

      - name: Test (directory durability fault injection)
        # Dataset creation's ordered directory-sync boundaries use this
        # thread-local fault seam. The default workspace suite intentionally
        # does not compile this test-only feature, so run it explicitly.
        run: cargo test -p strata-txn --features test-fault-injection

      - name: Loom tests (strata-index)
        # Scoped to this one crate rather than a workspace-wide
        # `RUSTFLAGS=--cfg loom cargo test` -- see
        # `.opencode/rules/concurrency-txn-layer.md` for why that would break
        # other crates in the dependency graph. This is the only CI-visible
        # regression gate for the empty-graph race and the publication-
        # barrier fix (`EntryPoint::claim_if_empty`,
        # `Node::is_published`/`mark_published`) -- both are proven solely
        # by the exhaustive loom models in `crates/index/src/graph.rs`'s
        # `loom_tests`, which nothing else in this workflow runs.
        run: |
          set -euo pipefail
          cargo rustc -p strata-index --lib --profile test --message-format=json -- --cfg loom \
            | tee /tmp/loom-index-build.json
          bin=$(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/loom-index-build.json | tail -1)
          if [ -z "$bin" ]; then
            echo "::error::no test binary produced by the --cfg loom build"
            exit 1
          fi
          "$bin" --test-threads=1

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (parallel-insert feature)
        run: cargo clippy -p strata-txn --all-targets --features parallel-insert -- -D warnings

      - name: Clippy (directory durability fault injection)
        run: cargo clippy -p strata-txn --all-targets --features test-fault-injection -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Doc
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo-deny (bans, sources, advisories)
        run: cargo deny check bans sources advisories
