name: Phase 2 query evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  projected-read-benchmark:
    name: projected read benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master at 2026-08-03
        with:
          toolchain: "1.97.1"

      - name: Record benchmark provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "runner.os=$RUNNER_OS"
            echo "runner.arch=$RUNNER_ARCH"
            rustc -Vv
            cargo -Vv
            sha256sum Cargo.lock
          } | tee artifacts/projected-read-provenance.log

      - name: Run projected-read benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench --locked -p strata-bench --bench projected_read_bench -- --noplot 2>&1 |
            tee artifacts/projected-read-benchmark.log

      - name: Run shared-handle fairness and RSS benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench --locked -p strata-bench --bench query_concurrency_bench --no-run
          binary=$(find target/release/deps -maxdepth 1 -type f -name 'query_concurrency_bench-*' -perm -111 | head -n 1)
          test -n "$binary"
          /usr/bin/time -v "$binary" --noplot 2>&1 |
            tee artifacts/query-concurrency-benchmark.log

      - name: Retain query evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-2-query-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  python-package-smoke:
    name: Python package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install --disable-pip-version-check maturin==1.9.4

      - name: Build wheel
        run: maturin build --release --locked --out dist

      - name: Install and import extension
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          python - <<'PY'
          import strata_ext

          required = [
            "Dataset",
            "Snapshot",
            "Transaction",
            "StrataError",
            "ValidationError",
            "ExecutionError",
            "ConflictError",
            "SchemaMigrationError",
            "InvalidQueryError",
            "UnsupportedTransactionReadError",
            "StorageDurabilityError",
            "CorruptionError",
          ]
          missing = [name for name in required if not hasattr(strata_ext, name)]
          if missing:
              raise SystemExit(f"missing exported names: {missing}")
          print("strata_ext import smoke passed")
          PY
