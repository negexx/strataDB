[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/txn",
    "crates/index",
    "crates/query",
    "crates/bindings",
    "crates/cli",
    "crates/chaos-worker",
    "bench",
    "tests/sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
arrow = "58"
criterion = "0.8"
hnsw_rs = "0.3"
proptest = "1"
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# NOTE: crates/index/Cargo.toml cannot use `[lints] workspace = true` like
# every other crate here — it needs a local `unexpected_cfgs` addition for
# its `cfg(loom)` shim, and Cargo forbids combining workspace-inherited
# lints with any local addition in the same [lints] table. It inlines a
# manual copy of these two tables instead (see its own Cargo.toml comment)
# — keep that copy in sync if this section changes.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Cargo's own defaults (codegen-units = 16, no LTO) favor compile speed over
# runtime speed; this is a production database engine, not a fast-iterating
# app, so trade a slower release build for cross-crate inlining -- this
# matters concretely for `crates/index`'s hot loops (distance evaluation,
# neighbor-slot scans), which call across the `strata-index`/`anndists`
# crate boundary constantly.
[profile.release]
lto = "thin"
codegen-units = 1
